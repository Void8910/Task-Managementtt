<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuestForge v0.5.1 + The Forge of the Forest 2D</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#06152e,#0b4aa2);color:#fff;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:11px 14px;background:#1976d2;color:#fff;font-weight:800;box-shadow:0 4px 12px #0003}button:hover{filter:brightness(1.08)}button.secondary{background:#ffffff18}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:28px;font-weight:900}.coins{display:flex;gap:7px;flex-wrap:wrap}.coin{padding:7px 11px;border-radius:20px;background:#ffffff18}.bronze{color:#e6a15a}.gold{color:#ffd84d}.diamond{color:#9ff7ff}.ruby{color:#ff7aa7}.card{background:#ffffff12;border:1px solid #ffffff22;border-radius:20px;padding:18px;margin-bottom:16px;backdrop-filter:blur(8px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.nav{min-height:120px;text-align:left;font-size:18px;background:linear-gradient(145deg,#1674d1,#164a9a)}.nav small{display:block;font-weight:400;opacity:.8;margin-top:8px}.hidden{display:none!important}.back{margin-bottom:14px;background:#ffffff18}.muted{opacity:.75}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tag{padding:5px 9px;border-radius:10px;background:#ffffff18;font-size:12px}.task{border-left:5px solid #4bb3ff}.task h3{margin:0 0 6px}.timer{font-size:22px;font-weight:900}.success{color:#9dffb0}.warn{color:#ffd37a}.input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff30;background:#071a37;color:#fff;margin:6px 0 12px}.avatar{font-size:50px}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:300}.modalbox{max-width:520px;width:100%;background:#09224a;border:1px solid #ffffff2b;border-radius:22px;padding:22px}.footer{opacity:.6;text-align:center;font-size:12px;margin:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#ffffff14}.activeTab{background:#36a4ff!important}.bar{height:12px;border-radius:99px;background:#ffffff15;overflow:hidden}.bar>div{height:100%;background:#48b2ff}.cart{position:sticky;bottom:10px;z-index:5}.gameWrap{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}.gameTop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.gameTop>*{pointer-events:auto}.gameCanvas{width:100%;height:100%;display:block;background:#182b12}.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:25px;color:#fff;text-shadow:0 0 3px #000;pointer-events:none}.gameToast{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);background:#000b;padding:10px 16px;border-radius:12px}.gameHint{position:absolute;left:15px;bottom:15px;background:#0008;padding:10px;border-radius:12px;font-size:13px;max-width:300px}.hotbar{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.slot{width:48px;height:48px;border:2px solid #ffffff55;border-radius:8px;background:#111a;display:grid;place-items:center}.slot.sel{border-color:#fff}.combat{position:absolute;inset:0;background:#0006;display:grid;place-items:center;z-index:6}.combatBox{width:min(400px,90vw);background:#12213b;border-radius:20px;padding:18px;text-align:center}.keybtn{font-size:34px;width:100px;height:100px;border-radius:20px;background:#2e85d7}.enemyBar{height:12px;background:#ffffff18;border-radius:99px;overflow:hidden}.enemyBar>div{height:100%;background:#f35b5b}.equip{border:1px dashed #ffffff30;padding:10px;border-radius:14px}.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.slotbox{min-height:54px;border-radius:10px;background:#ffffff0c;border:1px solid #ffffff19;padding:7px;font-size:12px}.shopitem{display:flex;justify-content:space-between;gap:12px;align-items:center}.cartRow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff16}@media(max-width:600px){.brand{font-size:23px}.gameHint{max-width:220px;font-size:11px}.slot{width:42px;height:42px}}
</style></head><body><div id="app" class="app"></div><div id="modal" class="modal hidden"><div id="modalBox" class="modalbox"></div></div><div id="game" class="gameWrap hidden"></div>
<script>
const ADMIN_USER='Void',ADMIN_PASS='Void8910strawberrymilk',DAY_MS=1440000;
const R={"Super Easy":{min:5,drop:0,bc:3,xp:10},"Easy":{min:10,drop:0,bc:5,xp:15},"Medium Short":{min:15,drop:0,bc:10,xp:30},"Medium Long":{min:25,drop:10,bc:15,xp:40},"Hard Short":{min:30,drop:10,bc:25,xp:60},"Hard Long":{min:45,drop:10,bc:45,xp:100},"Super Hard":{min:60,drop:10,bc:75,xp:150},"Insane":{min:60,drop:10,bc:100,xp:300}};
const SHOP=[['Free Pass',1,3,'5 hours','free'],['Free Pass',2,6,'10 hours','free'],['Free Pass',3,15,'Entire day','free'],['Shield',1,6,'5 hours','shield'],['Shield',2,12,'10 hours','shield'],['Shield',3,30,'Entire day','shield'],['Game Pass',1,25,'30 min • Skate • Fall Guys • Fortnite','game'],['Game Pass',2,50,'1 hour • Tier 1 + Minecraft offline • GTA V offline • Ultimate Chicken Horse','game'],['Stay Pass',1,5,'5 minutes','stay'],['Stay Pass',2,20,'30 minutes','stay'],['Stay Pass',3,50,'Entire day','stay'],['XP Pass',1,10,'10 XP','xp'],['XP Pass',2,25,'50 XP','xp'],['XP Pass',3,60,'100 XP','xp'],['Outside Pass',1,20,'10–30 minutes outside','outside'],['Outside Pass',2,35,'20–60 minutes outside','outside'],['Lucky Block',1,15,'Random shop item','lucky']];
const QUESTS=[['Spend at least 30 Bronze Coins',50,5,'spend',30],['Spend at least 20 Bronze Coins',30,3,'spend',20],['Spend at least 10 Bronze Coins',15,1,'spend',10],['Earn at least 30 Bronze Coins',50,5,'earn',30],['Earn at least 20 Bronze Coins',30,3,'earn',20],['Earn at least 10 Bronze Coins',15,1,'earn',10],['Complete at least three tasks',50,5,'tasks',3],['Complete at least two tasks',30,3,'tasks',2],['Complete at least one task',15,1,'tasks',1],['Earn at least 20 XP',50,5,'xp',20],['Earn at least 10 XP',30,3,'xp',10],['Level up once',50,5,'level',1],['Play 1 hour of Forge of the Forest',10,10,'play',60]];
const CURRENCIES=['bronze','gold','diamond','ruby'];
const ICON={bronze:'🟤',gold:'🟡',diamond:'💎',ruby:'🔴'};
const val={bronze:1,gold:10,diamond:50,ruby:100};
let db=JSON.parse(localStorage.getItem('questforge')||'null')||{activeItems:[],profile:{name:'Player',level:1,xp:0,bronze:25,gold:0,diamond:0,ruby:0,avatar:'🧑‍🚀'},tasks:[],history:[],inventory:[],requests:[],settings:{music:false,volume:40,sensitivity:1},next:1,cart:[],daily:{date:'',items:[],completed:[]},forge:{playMs:0,slots:[null,null,null],active:0}};
if(!db.activeItems)db.activeItems=[];
function save(){if(!db.activeItems)db.activeItems=[];localStorage.setItem('questforge',JSON.stringify(db))}function id(){return db.next++}function need(){return 100+(db.profile.level-1)*10}
function totalValue(){return CURRENCIES.reduce((s,k)=>s+(db.profile[k]||0)*val[k],0)}
function fromValue(n){let o={};for(let i=CURRENCIES.length-1;i>=0;i--){let k=CURRENCIES[i];o[k]=Math.floor(n/val[k]);n%=val[k]}return o}
function addMoney(v){for(let k in v)db.profile[k]=(db.profile[k]||0)+v[k]}
function spendValue(v){let n=v;let have=totalValue();if(have<n)return false;let out={...db.profile};for(let k of CURRENCIES)out[k]=0;let rem=have-n;let x=fromValue(rem);for(let k of CURRENCIES)db.profile[k]=x[k];return true}
function addXP(n){let leveled=0;db.profile.xp+=n;while(db.profile.xp>=need()){db.profile.xp-=need();db.profile.level++;db.profile.bronze+=5+db.profile.level;leveled++}return leveled}
function coins(){return `<div class="coins">${CURRENCIES.map(k=>`<span class="coin ${k}">${ICON[k]} ${db.profile[k]||0}</span>`).join('')}</div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function layout(c){document.getElementById('app').innerHTML=`<div class="top"><div class="brand">⚔️ QuestForge</div>${coins()}</div>${c}<div class="footer">QuestForge v0.5.1 • saved on this device</div>`}
function back(){home()}function home(){layout(`<div class="card row"><div><div class="avatar">${db.profile.avatar}</div><b>${esc(db.profile.name)}</b><div class="muted">Level ${db.profile.level} • ${db.profile.xp}/${need()} XP</div></div><div><button onclick="settings()">⚙️</button></div></div><div class="grid"><button class="nav" onclick="current()">⏱️ Current Tasks<small>Active tasks and timers</small></button><button class="nav" onclick="available()">📋 Available Tasks<small>Choose work</small></button><button class="nav" onclick="shop()">🛒 Shop<small>Buy & trade</small></button><button class="nav" onclick="inventory()">🎒 Inventory<small>Use your items</small></button><button class="nav" onclick="historyPage()">📜 Past Tasks<small>Previous rewards</small></button><button class="nav" onclick="stats()">👤 Account Stats<small>Level & currencies</small></button><button class="nav" onclick="quests()">📅 Daily Quests<small>5 rotating quests</small></button><button class="nav" onclick="window.launchForge()">🌲 Forge of the Forest<small>Play the survival game</small></button></div>`)}
function stats(){layout(`<button onclick="back()">← Back</button><div class="card"><h2>👤 Account Stats</h2><div class="avatar">${db.profile.avatar}</div><h3>${esc(db.profile.name)}</h3><p>⭐ Level ${db.profile.level}</p><p>XP: ${db.profile.xp}/${need()}</p>${coins()}<button onclick="rename()">✏️ Change Name</button></div>`)}
function rename(){openM(`<h2>Change Name</h2><input id="nn" class="input" placeholder="New name"><button onclick="doRename()">Save</button> <button class="secondary" onclick="closeM()">Cancel</button>`)}function doRename(){let n=document.getElementById('nn').value.trim();if(n){db.profile.name=n;save();closeM();stats()}}
function settings(){layout(`<button onclick="back()">← Back</button><div class="card"><h2>⚙️ Settings</h2><p>🎵 Music: ${db.settings.music?'On':'Off'}</p><button onclick="db.settings.music=!db.settings.music;save();settings()">Toggle Music</button><label>Sensitivity <input id="sens" class="input" type="range" min="0.3" max="2" step="0.1" value="${db.settings.sensitivity||1}" oninput="db.settings.sensitivity=this.value;save()"></label><p class="muted">Game controls: WASD move • Mouse look • Left click attack • Right click interact • E inventory • Q quick-swap • R throw</p><hr><button onclick="adminLogin()">🔐 Admin Version</button></div>`)}
function adminLogin(){openM(`<h2>Admin Version</h2><input id="au" class="input" placeholder="Username"><input id="ap" type="password" class="input" placeholder="Password"><button onclick="checkAdmin()">Enter</button> <button class="secondary" onclick="closeM()">Cancel</button>`)}
function checkAdmin(){if(document.getElementById('au').value===ADMIN_USER&&document.getElementById('ap').value===ADMIN_PASS){closeM();admin()}else alert('Incorrect login.')}
function available(){let a=db.tasks.filter(t=>t.status==='available');layout(`<button onclick="back()">← Back</button><h2>📋 Available Tasks</h2>${a.length?a.map(t=>task(t,true)).join(''):`<div class="card muted">No tasks available.</div>`}`)}
function current(){let a=db.tasks.filter(t=>t.status==='active'||t.status==='submitted');layout(`<button onclick="back()">← Back</button><h2>⏱️ Current Tasks</h2>${a.length?a.map(t=>task(t,false)).join(''):`<div class="card muted">No current tasks.</div>`}`)}
function task(t,can){let r=R[t.rarity],e=t.status==='active'?Date.now()-t.started:t.paused||0,m=Math.floor(e/60000),s=Math.floor(e/1000)%60,d=r.drop?Math.floor(Math.max(0,m-r.min)/10):0,p=Math.max(0,Math.floor(r.bc*(1-d*.1)));let rw=fromValue(p);let rwText=CURRENCIES.filter(k=>rw[k]).map(k=>`${ICON[k]} ${rw[k]}`).join(' ')||'0';return `<div class="card task"><div class="row"><div><span class="tag">${esc(t.rarity)}</span><h3>${esc(t.prompt)}</h3><div>Target ${r.min} min • Full ${fromValue(r.bc).gold?ICON.gold+' '+fromValue(r.bc).gold:'🟤 '+r.bc} • ${r.xp} XP</div><div class="muted">Current reward: ${rwText}</div></div><div class="timer">${m}:${String(s).padStart(2,'0')}</div></div>${can?`<button onclick="accept(${t.id})">▶️ Accept Task</button>`:t.status==='active'?`<button onclick="submit(${t.id})">✅ I'm Done</button>`:`<div class="success">📨 Submitted — timer paused.</div>`}</div>`}
function accept(i){let t=db.tasks.find(x=>x.id===i);t.status='active';t.started=Date.now();save();current();tick()}function submit(i){let t=db.tasks.find(x=>x.id===i);t.paused=Date.now()-t.started;t.status='submitted';db.requests.push({id:id(),type:'complete_task',taskId:i,status:'pending'});save();current()}
function tick(){if(document.querySelector('.timer'))setTimeout(()=>{if(document.querySelector('.timer')){current();tick()}},1000)}
function historyPage(){layout(`<button onclick="back()">← Back</button><h2>📜 Completed / Past</h2>${db.history.length?db.history.slice().reverse().map(h=>`<div class="card"><b>${esc(h.prompt)}</b><div>${h.rarity} • ${moneyString(h.reward)} • ${h.xp} XP</div><div class="muted">${new Date(h.date).toLocaleString()}</div></div>`).join(''):`<div class="card muted">No past tasks.</div>`}`)}
function moneyString(b){let o=fromValue(b);return CURRENCIES.filter(k=>o[k]).map(k=>`${ICON[k]} ${o[k]}`).join(' ')||'0'}
function shop(){expireActiveItems();rotateLTO();let deal=db.lto;layout(`<button onclick="back()">← Back</button><div class="tabs"><button class="activeTab">🛒 Shop</button><button onclick="tradeCenter()">🔄 Trade-In</button></div>${deal?`<div class="card" style="border:2px solid #ffd84d"><h2>🔥 LIMITED TIME OFFER</h2><div class="row"><div><b>${deal.name}</b><p>${deal.text}</p></div><button onclick="addCart(${deal.index},true)">Add Deal</button></div></div>`:''}<div class="grid">${SHOP.map((s,i)=>`<div class="card shopitem"><div><b>${s[0]} Tier ${s[1]}</b><p class="muted">${s[3]}</p><p>${moneyString(s[2])} <span class="tag">${s[4]}</span></p></div><button onclick="addCart(${i})">➕</button></div>`).join('')}</div>${cartPanel()}`)}
function rotateLTO(){let slot=Math.floor(Date.now()/3600000);if(db.ltoSlot!==slot){db.ltoSlot=slot;let cheap=SHOP.map((s,i)=>({s,i})).filter(x=>x.s[2]<=15),exp=SHOP.map((s,i)=>({s,i})).filter(x=>x.s[2]>=30);let pool=Math.random()<.5?cheap:exp;if(Math.random()<.75){let x=pool[Math.floor(Math.random()*pool.length)];let discount= [10,15,20,25][Math.floor(Math.random()*4)];db.lto={index:x.i,name:x.s[0]+' Tier '+x.s[1],text:discount+'% OFF — '+Math.floor(x.s[2]*(1-discount/100))+' Bronze value',discount};}else db.lto=null;save()}}
function addCart(i,deal=false){let s=SHOP[i];db.cart.push({shopIndex:i,deal,price:deal?Math.floor(s[2]*(1-db.lto.discount/100)):s[2]});save();shop()}
function removeCart(i){db.cart.splice(i,1);save();shop()}
function cartPanel(){let total=db.cart.reduce((s,x)=>s+x.price,0);return `<div class="card cart"><h3>🛒 Cart (${db.cart.length})</h3>${db.cart.map((x,i)=>{let s=SHOP[x.shopIndex];return `<div class="cartRow"><span>${s[0]} T${s[1]} — 🟤 ${x.price}</span><button onclick="removeCart(${i})">✕</button></div>`}).join('')}<div class="row"><b>Total: ${moneyString(total)}</b><button onclick="checkout()" ${db.cart.length?'':'disabled'}>Proceed to Purchase</button></div></div>`}
function checkout(){let total=db.cart.reduce((s,x)=>s+x.price,0);if(!spendValue(total))return alert('Not enough value.');for(let c of db.cart){let s=SHOP[c.shopIndex];if(s[4]==='xp')addXP([10,50,100][s[1]-1]);else if(s[4]==='lucky')db.inventory.push({id:id(),name:'Lucky Block',tier:1,duration:'Open once',type:'lucky',active:false});else db.inventory.push({id:id(),name:s[0],tier:s[1],duration:s[3],type:s[4],active:false});}db.cart=[];db.history.push({prompt:'Shop purchase',rarity:'SHOP',reward:-total,xp:0,date:Date.now()});save();shop()}
function tradeCenter(){layout(`<button onclick="shop()">← Shop</button><h2>🔄 Trade-In Center</h2><div class="card"><h3>Currency Exchange</h3><p>10 Bronze = 1 Gold • 5 Gold = 1 Diamond • 2 Diamond = 1 Ruby</p><div class="grid"><button onclick="convert('bronze','gold',10)">10 🟤 → 1 🟡</button><button onclick="convert('gold','bronze',1)">1 🟡 → 10 🟤</button><button onclick="convert('gold','diamond',5)">5 🟡 → 1 💎</button><button onclick="convert('diamond','gold',1)">1 💎 → 5 🟡</button><button onclick="convert('diamond','ruby',2)">2 💎 → 1 🔴</button><button onclick="convert('ruby','diamond',1)">1 🔴 → 2 💎</button></div></div><div class="card"><h3>📦 Trade In Items — 65%</h3>${db.inventory.length?db.inventory.filter(x=>!x.active).map((x,i)=>{let s=SHOP.find(s=>s[0]===x.name&&s[1]===x.tier);let v=s?Math.floor(s[2]*.65):0;return `<div class="row" style="margin:8px 0"><span>${x.name} T${x.tier}</span><button onclick="tradeItem(${i},${v})">Trade for 🟤 ${v}</button></div>`}).join(''):'No tradable items.'}</div>`)}
function convert(a,b,amount){if((db.profile[a]||0)<amount)return alert('Not enough currency.');let out={bronze:0,gold:0,diamond:0,ruby:0};let rate=val[a]*amount/val[b];if(rate%1!==0)return alert('Invalid conversion.');db.profile[a]-=amount;db.profile[b]=(db.profile[b]||0)+rate;save();tradeCenter()}
function tradeItem(i,v){let x=db.inventory[i];if(x.active)return alert('Active items cannot be traded.');db.inventory.splice(i,1);addMoney(fromValue(v));save();tradeCenter()}
function expireActiveItems(){if(!db.activeItems)db.activeItems=[];let now=Date.now();db.activeItems=db.activeItems.filter(x=>!x.expires||x.expires>now);save()}
function inventory(){expireActiveItems();layout(`<button onclick="back()">← Back</button><h2>🎒 Inventory</h2>${db.inventory.length?db.inventory.map((x,i)=>`<div class="card row"><div><b>${x.name} Tier ${x.tier}</b><div class="muted">${x.duration}</div></div><button onclick="useItem(${i})">Use</button></div>`).join(''):`<div class="card muted">Inventory empty.</div>`}<h2>⏱️ Active Items</h2>${db.activeItems?.length?db.activeItems.map((x,i)=>`<div class="card row"><div><b>${x.name} Tier ${x.tier}</b><div class="success">Active • ${Math.max(0,Math.ceil((x.expires-Date.now())/60000))} min left</div></div><button onclick="requestPause(${i})">⏸️ Request Pause</button></div>`).join(''):`<div class="card muted">No active items.</div>`}`)}
function useItem(i){let x=db.inventory[i];db.requests.push({id:id(),type:x.type==='outside'?'outside':x.type==='lucky'?'lucky':'use_item',inventoryIndex:i,status:'pending'});save();alert('Request sent to Admin Version.');inventory()}
function requestPause(i){db.requests.push({id:id(),type:'pause_item',activeIndex:i,status:'pending'});save();alert('Pause request sent to Admin.');inventory()}
function quests(){ensureDaily();layout(`<button onclick="back()">← Back</button><h2>📅 Daily Quests</h2><p class="muted">5 quests refresh each day.</p>${db.daily.items.map((q,idx)=>{let done=db.daily.completed.includes(idx),prog=questProgress(q);return `<div class="card"><div class="row"><div><b>${q[0]}</b><div class="muted">Reward: ${q[1]} XP + ${q[2]} 🟤</div></div><span class="tag">${done?'✅ Complete':Math.min(prog,q[4])+'/'+q[4]}</span></div><div class="bar"><div style="width:${Math.min(100,prog/q[4]*100)}%"></div></div>${done?'':prog>=q[4]?`<button onclick="claimQuest(${idx})">Claim Reward</button>`:''}</div>`}).join('')}`)}
function ensureDaily(){let d=new Date().toDateString();if(db.daily.date!==d){db.daily={date:d,items:[...QUESTS].sort(()=>Math.random()-.5).slice(0,5),completed:[]};save()}}
function questProgress(q){let t=q[3],goal=q[4];if(t==='spend')return Math.max(0,db.dailySpend||0);if(t==='earn')return Math.max(0,db.dailyEarn||0);if(t==='tasks')return db.dailyTasks||0;if(t==='xp')return db.dailyXP||0;if(t==='level')return db.dailyLevels||0;if(t==='play')return Math.floor((db.forge.playMs||0)/60000);return 0}
function claimQuest(i){let q=db.daily.items[i],p=questProgress(q);if(p<q[4]||db.daily.completed.includes(i))return;db.daily.completed.push(i);db.profile.bronze+=q[2];let before=db.profile.level;addXP(q[1]);let lv=db.profile.level-before;db.dailyLevels=(db.dailyLevels||0)+lv;save();quests()}
function admin(){let q=db.requests.filter(x=>x.status==='pending');layout(`<div class="row"><button onclick="back()">← Player View</button><h2>🛠️ Admin</h2></div><div class="card"><h3>💰 Player Economy</h3><div class="grid">${CURRENCIES.map(k=>`<label>${ICON[k]} ${k}<input id="bal_${k}" class="input" type="number" value="${db.profile[k]||0}"></label>`).join('')}<label>⭐ XP<input id="bal_xp" class="input" type="number" value="${db.profile.xp}"></label></div><button onclick="saveBalances()">Save Balance</button></div><div class="card"><h3>➕ Create Task</h3><input id="tp" class="input" placeholder="Task prompt"><select id="rr" class="input">${Object.keys(R).map(x=>`<option>${x}</option>`).join('')}</select><div id="rinfo" class="muted"></div><button onclick="createTask()">Create Task</button></div><div class="card"><h3>📨 Requests (${q.length})</h3>${q.length?q.map(request).join(''):`<span class="muted">Nothing waiting.</span>`}</div><div class="card"><h3>📋 All Tasks</h3>${db.tasks.map(t=>`<div class="row" style="margin:8px 0"><span>${esc(t.prompt)} — <span class="tag">${t.rarity}</span> — ${R[t.rarity].min}m — ${moneyString(R[t.rarity].bc)} + ${R[t.rarity].xp} XP — ${t.status}</span><span>${t.status==='active'?`<button onclick="override(${t.id})">Override</button>`:''}<button onclick="deleteTask(${t.id})">🗑️</button></span></div>`).join('')||'No tasks.'}</div><div class="card"><h3>🎒 Player Inventory</h3>${(db.inventory.length||db.activeItems?.length)?[...(db.inventory||[]).map((x,i)=>({x,kind:'inventory',i})),...(db.activeItems||[]).map((x,i)=>({x,kind:'active',i}))].map(a=>`<div class="row"><span>${a.x.name} T${a.x.tier}${a.kind==='active'?' — active':''}</span><button onclick="adminDeleteAnyItem('${a.kind}',${a.i})">Delete</button></div>`).join(''):'Empty.'}</div>`);document.getElementById('rr').onchange=()=>showRInfo();showRInfo()}
function showRInfo(){let r=R[document.getElementById('rr').value];document.getElementById('rinfo').textContent=`Time: ${r.min} min • Reward: ${moneyString(r.bc)} • XP: ${r.xp} • ${r.drop?`10% downgrade every ${r.drop} min late`:'No downgrades'}`}
function saveBalances(){for(let k of CURRENCIES)db.profile[k]=Math.max(0,Number(document.getElementById('bal_'+k).value)||0);db.profile.xp=Math.max(0,Number(document.getElementById('bal_xp').value)||0);save();admin()}
function createTask(){let p=document.getElementById('tp').value.trim(),r=document.getElementById('rr').value;if(!p)return alert('Enter a task prompt.');db.tasks.push({id:id(),prompt:p,rarity:r,status:'available'});save();admin()}
function deleteTask(i){if(confirm('Delete this task?')){db.tasks=db.tasks.filter(t=>t.id!==i);db.requests=db.requests.filter(q=>q.taskId!==i);save();admin()}}
function request(q){if(q.type==='complete_task'){let t=db.tasks.find(x=>x.id===q.taskId),r=t&&R[t.rarity];return `<div class="card"><b>✅ Complete Task</b><p>${t?esc(t.prompt):'Missing task'}</p><p>Target: ${r.min} min • Full: ${moneyString(r.bc)} • XP: ${r.xp}</p><button onclick="approve(${q.id})">Approve</button> <button class="secondary" onclick="reject(${q.id})">Reject</button></div>`}if(q.type==='pause_item')return `<div class="card"><b>⏸️ Pause Item</b><p>${db.activeItems?.[q.activeIndex]?.name||'Missing item'}</p><button onclick="approvePause(${q.id})">Approve Pause</button> <button class="secondary" onclick="reject(${q.id})">Reject</button></div>`;if(q.type==='outside')return `<div class="card"><b>🚶 Outside Pass</b><p>${db.inventory[q.inventoryIndex]?.name||'Missing item'}</p><button onclick="approveItem(${q.id})">Approve</button> <button class="secondary" onclick="reject(${q.id})">Reject</button></div>`;if(q.type==='lucky')return `<div class="card"><b>🎁 Lucky Block</b><button onclick="openLucky(${q.id})">Approve & Open</button> <button class="secondary" onclick="reject(${q.id})">Reject</button></div>`;return `<div class="card"><b>🎒 Use Item</b><p>${db.inventory[q.inventoryIndex]?.name||'Missing item'}</p><button onclick="approveItem(${q.id})">Approve</button> <button class="secondary" onclick="reject(${q.id})">Reject</button></div>`}
function approve(qid){let q=db.requests.find(x=>x.id===qid),t=db.tasks.find(x=>x.id===q.taskId),r=R[t.rarity],m=(t.paused||0)/60000,d=r.drop?Math.floor(Math.max(0,m-r.min)/10):0,p=Math.max(0,Math.floor(r.bc*(1-d*.1)));t.status='completed';q.status='approved';db.profile.bronze+=p;db.dailyEarn=(db.dailyEarn||0)+p;db.dailyTasks=(db.dailyTasks||0)+1;let before=db.profile.level;let xpPaid=Math.floor(r.xp);db.profile.xp+=xpPaid;db.dailyXP=(db.dailyXP||0)+xpPaid;let lv=addXP(0);db.dailyLevels=(db.dailyLevels||0)+(db.profile.level-before);db.history.push({prompt:t.prompt,rarity:t.rarity,reward:p,xp:xpPaid,date:Date.now()});save();admin()}
function approveItem(qid){let q=db.requests.find(x=>x.id===qid),x=db.inventory[q.inventoryIndex];if(x){let dur=x.duration.includes('Entire')?1440:parseInt(x.duration)||30;db.inventory.splice(q.inventoryIndex,1);(db.activeItems||(db.activeItems=[])).push({...x,active:true,startedAt:Date.now(),durationMinutes:dur,expires:Date.now()+dur*60000});}q.status='approved';save();admin()}
function approvePause(qid){let q=db.requests.find(x=>x.id===qid),x=db.activeItems?.[q.activeIndex];if(x){x.remaining=Math.max(0,(x.expires||Date.now())-Date.now());x.paused=true;x.expires=null;x.active=false;(db.inventory||(db.inventory=[])).push(x);db.activeItems.splice(q.activeIndex,1)}q.status='approved';save();admin()}
function reject(qid){let q=db.requests.find(x=>x.id===qid);q.status='rejected';save();admin()}
function adminDeleteAnyItem(kind,i){if(kind==='active')db.activeItems.splice(i,1);else db.inventory.splice(i,1);save();admin()}function override(i){let t=db.tasks.find(x=>x.id===i);t.status='completed';save();admin()}
function openLucky(qid){let q=db.requests.find(x=>x.id===qid);let x=db.inventory[q.inventoryIndex];let roll=Math.random(),max=roll<.01?6:roll<.11?5:roll<.36?3:roll<.76?2:1;let choices=SHOP.filter(s=>s[2]<=max*10);let s=choices[Math.floor(Math.random()*choices.length)];db.inventory.splice(q.inventoryIndex,1);db.inventory.push({id:id(),name:s[0],tier:s[1],duration:s[3],type:s[4],active:false});q.status='approved';save();alert('Lucky Block opened: '+s[0]+' Tier '+s[1]);admin()}
function openM(x){document.getElementById('modalBox').innerHTML=x;document.getElementById('modal').classList.remove('hidden')}function closeM(){document.getElementById('modal').classList.add('hidden')}

function launchForge(){
  const ov=document.getElementById('forge2dOverlay');
  const frame=document.getElementById('forge2dFrame');
  ov.classList.add('open');
  document.body.style.overflow='hidden';
  if(!frame.srcdoc) frame.srcdoc=atob(FORGE_2D_B64);
}
function exitForge(){
  const ov=document.getElementById('forge2dOverlay');
  ov.classList.remove('open');
  document.body.style.overflow='';
  const frame=document.getElementById('forge2dFrame');
  frame.srcdoc='';
}
ensureDaily();save();home();
</script>
