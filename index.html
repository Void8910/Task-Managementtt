<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuestForge</title>
<style>
*{box-sizing:border-box}
:root{--bg1:#06152e;--bg2:#0b4aa2;--card:#ffffff12;--line:#ffffff25;--text:#fff;--muted:#b7c8dc;--accent:#4bb3ff}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text)}
body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:11px 15px;background:#1976d2;color:#fff;font-weight:800;box-shadow:0 4px 12px #0003}button:hover{filter:brightness(1.1)}button.secondary{background:#ffffff15;border:1px solid var(--line)}button.danger{background:#a82d3b}.hidden{display:none!important}
.app{max-width:1120px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.brand{font-size:28px;font-weight:950}.coins{display:flex;gap:7px;flex-wrap:wrap}.coin{padding:8px 12px;border-radius:20px;background:#ffffff15;font-weight:850}.bronze{color:#e6a15a}.gold{color:#ffd84d}.diamond{color:#9ff7ff}.ruby{color:#ff7188}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:15px;backdrop-filter:blur(8px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.nav{min-height:125px;text-align:left;font-size:18px;background:linear-gradient(145deg,#1674d1,#164a9a)}.nav small{display:block;font-weight:400;opacity:.82;margin-top:8px}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.tag{padding:5px 9px;border-radius:10px;background:#ffffff18;font-size:12px}.input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#071a37;color:#fff;margin:6px 0 12px}.avatar{font-size:54px}.footer{opacity:.55;text-align:center;font-size:12px;margin:24px}.bar{height:12px;background:#ffffff13;border-radius:99px;overflow:hidden}.fill{height:100%;background:#4bb3ff}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modalbox{max-width:540px;width:100%;max-height:90vh;overflow:auto;background:#09224a;border:1px solid var(--line);border-radius:22px;padding:22px}.pill{display:inline-block;padding:5px 9px;border-radius:10px;background:#ffffff12}.shopdeal{border:2px solid #ffd84d;background:linear-gradient(135deg,#4a3505,#142e55);transform:scale(1.01)}.cart-total{font-size:20px;font-weight:900}.small{font-size:13px}.item-active{border-left:5px solid #6dff9a}.quest{border-left:5px solid #ffd84d}.adminbox{background:#050e1d99}
@media(max-width:600px){.brand{font-size:23px}.app{padding:12px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal hidden"><div id="modalBox" class="modalbox"></div></div>

<script>
"use strict";

const ADMIN_USER="Void";
const ADMIN_PASS="Void8910strawberrymilk";

const RARITIES={
 "Super Easy":{min:5,drop:0,bc:3,xp:10},
 "Easy":{min:10,drop:0,bc:5,xp:15},
 "Medium Short":{min:15,drop:0,bc:10,xp:30},
 "Medium Long":{min:25,drop:10,bc:15,xp:40},
 "Hard Short":{min:30,drop:10,bc:25,xp:60},
 "Hard Long":{min:45,drop:10,bc:45,xp:100},
 "Super Hard":{min:60,drop:10,bc:75,xp:150},
 "Insane":{min:60,drop:10,bc:100,xp:300}
};

const SHOP=[
 {name:"Free Pass",tier:1,bc:3,duration:"5 hours"},
 {name:"Free Pass",tier:2,bc:6,duration:"10 hours"},
 {name:"Free Pass",tier:3,bc:15,duration:"Entire day"},
 {name:"Shield",tier:1,bc:6,duration:"5 hours"},
 {name:"Shield",tier:2,bc:12,duration:"10 hours"},
 {name:"Shield",tier:3,bc:30,duration:"Entire day"},
 {name:"Game Pass",tier:1,bc:25,duration:"30 minutes • Skate • Fall Guys • Fortnite"},
 {name:"Game Pass",tier:2,bc:50,duration:"1 hour • Tier 1 + Minecraft offline • GTA V offline • Ultimate Chicken Horse"},
 {name:"Stay Pass",tier:1,bc:5,duration:"5 minutes"},
 {name:"Stay Pass",tier:2,bc:20,duration:"30 minutes"},
 {name:"Stay Pass",tier:3,bc:50,duration:"Entire day"},
 {name:"Outside Pass",tier:1,bc:20,duration:"10–30 minutes outside with supervision"},
 {name:"Outside Pass",tier:2,bc:35,duration:"20–60 minutes outside with supervision"},
 {name:"XP Pass",tier:1,bc:10,duration:"10 XP"},
 {name:"XP Pass",tier:2,bc:25,duration:"50 XP"},
 {name:"XP Pass",tier:3,bc:60,duration:"100 XP"},
 {name:"Lucky Block",tier:1,bc:15,duration:"One random shop item or XP reward"}
];

const QUEST_DEFS=[
 ["Spend at least 30 Bronze Coins",50,5],
 ["Spend at least 20 Bronze Coins",30,3],
 ["Spend at least 10 Bronze Coins",15,1],
 ["Earn at least 30 Bronze Coins",50,5],
 ["Earn at least 20 Bronze Coins",30,3],
 ["Earn at least 10 Bronze Coins",15,1],
 ["Complete at least three tasks",50,5],
 ["Complete at least two tasks",30,3],
 ["Complete at least one task",15,1],
 ["Earn at least 20 XP",50,5],
 ["Earn at least 10 XP",30,3],
 ["Level up once",15,1],
 ["Play 1 hour of Forge of the Forest",50,5]
];

const AVATARS=["🧑‍🚀","🧙","🧝","🧛","🧟","🧞","🦊","🐺","🐻","🦉","🐲","🦖","🧑‍🌾","🧑‍🔧","🧑‍🎨","🧑‍🚒","🥷","🤖"];

let db=JSON.parse(localStorage.getItem("questforge")||"null") || {
 profile:{name:"Player",level:1,xp:0,bronze:0,gold:0,diamond:0,ruby:0,avatar:"🧑‍🚀"},
 tasks:[],history:[],inventory:[],requests:[],cart:[],settings:{music:true,volume:40,dark:false},
 quests:{date:"",items:[]}, stats:{spent:0,earnedBronze:0,earnedXP:0,tasksCompleted:0,forgeSeconds:0},next:1
};

function save(){localStorage.setItem("questforge",JSON.stringify(db))}
function id(){return db.next++}
function needXP(){return 100+(db.profile.level-1)*10}

function addXP(amount){
 let before=db.profile.level;
 db.profile.xp+=amount; db.stats.earnedXP+=amount;
 while(db.profile.xp>=needXP()){
   db.profile.xp-=needXP();
   db.profile.level++;
   db.profile.bronze+=5+db.profile.level;
   db.stats.earnedBronze+=5+db.profile.level;
 }
 checkQuests();
 return db.profile.level>before;
}

function addBronze(n){db.profile.bronze+=n;db.stats.earnedBronze+=n;checkQuests()}
function totalBronzeValue(){
 return db.profile.bronze + db.profile.gold*10 + db.profile.diamond*50 + db.profile.ruby*100;
}
function spendValue(v){
 let need=v;
 if(db.profile.bronze>=need){db.profile.bronze-=need;return true}
 const goldNeeded=Math.ceil(need/10);
 if(db.profile.gold>=goldNeeded){
   db.profile.gold-=goldNeeded;
   const change=goldNeeded*10-need;
   db.profile.bronze+=change;
   return true;
 }
 const diaNeeded=Math.ceil(need/50);
 if(db.profile.diamond>=diaNeeded){
   db.profile.diamond-=diaNeeded;
   const change=diaNeeded*50-need;
   db.profile.bronze+=change;
   return true;
 }
 const rubNeeded=Math.ceil(need/100);
 if(db.profile.ruby>=rubNeeded){
   db.profile.ruby-=rubNeeded;
   const change=rubNeeded*100-need;
   db.profile.bronze+=change;
   return true;
 }
 return false;
}
function coins(){
 return `<div class="coins">
 <span class="coin bronze">🟤 ${db.profile.bronze}</span>
 <span class="coin gold">🟡 ${db.profile.gold}</span>
 <span class="coin diamond">💎 ${db.profile.diamond}</span>
 <span class="coin ruby">🔴 ${db.profile.ruby}</span>
 </div>`;
}
function layout(content){
 document.getElementById("app").innerHTML=`<div class="top"><div class="brand">⚔️ QuestForge</div>${coins()}</div>${content}<div class="footer">QuestForge • saved locally on this device</div>`;
}
function back(){home()}

function home(){
 layout(`
 <div class="card row">
   <div><div class="avatar">${db.profile.avatar}</div><b>${esc(db.profile.name)}</b>
   <div class="muted">Level ${db.profile.level} • ${db.profile.xp}/${needXP()} XP</div>
   <div class="bar" style="width:min(420px,75vw);margin-top:8px"><div class="fill" style="width:${Math.min(100,db.profile.xp/needXP()*100)}%"></div></div></div>
   <button onclick="settings()">⚙️ Settings</button>
 </div>
 <div class="grid">
  <button class="nav" onclick="current()">⏱️ Current Tasks<small>Active tasks and submitted tasks</small></button>
  <button class="nav" onclick="available()">📋 Available Tasks<small>Tasks ready to accept</small></button>
  <button class="nav" onclick="shop()">🛒 Shop<small>Items, passes and limited offers</small></button>
  <button class="nav" onclick="trade()">🔄 Trade In<small>Exchange currencies and items</small></button>
  <button class="nav" onclick="inventory()">🎒 Inventory<small>Items and active timers</small></button>
  <button class="nav" onclick="questsPage()">⭐ Daily Quests<small>13 rotating goals</small></button>
  <button class="nav" onclick="historyPage()">📜 Completed / Past<small>Rewards and old tasks</small></button>
  <button class="nav" onclick="stats()">👤 Account Stats<small>Level, XP and all balances</small></button>
 </div>`);
}

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function taskHTML(t,canAccept){
 const r=RARITIES[t.rarity];
 let elapsed=t.status==="active"?Date.now()-t.started:t.elapsed||0;
 const minutes=elapsed/60000;
 const downgrades=r.drop?Math.floor(Math.max(0,minutes-r.min)/10):0;
 const reward=Math.max(0,Math.floor(r.bc*(1-downgrades*.1)));
 return `<div class="card">
 <div class="row"><div><span class="tag">${esc(t.rarity)}</span><h3>${esc(t.prompt)}</h3>
 <div>Target: ${r.min} min • Full reward: ${r.bc} 🟤 • Current: <b>${reward} 🟤</b> • ${r.xp} XP</div>
 ${r.drop?`<div class="muted small">Downgrades: every 10 minutes after ${r.min} minutes.</div>`:"<div class=\"muted small\">No reward downgrade.</div>"}
 </div><b>${Math.floor(elapsed/60000)}:${String(Math.floor(elapsed/1000)%60).padStart(2,"0")}</b></div>
 ${canAccept?`<button onclick="acceptTask(${t.id})">▶️ Accept Task</button>`:t.status==="active"?`<button onclick="submitTask(${t.id})">✅ I'm Done</button>`:`<div class="pill">📨 Submitted — timer paused</div>`}</div>`;
}
function available(){
 const a=db.tasks.filter(t=>t.status==="available");
 layout(`<button class="secondary" onclick="back()">← Back</button><h2>📋 Available Tasks</h2>${a.length?a.map(t=>taskHTML(t,true)).join(""):`<div class="card muted">No tasks are available right now.</div>`}`);
}
function current(){
 const a=db.tasks.filter(t=>["active","submitted"].includes(t.status));
 layout(`<button class="secondary" onclick="back()">← Back</button><h2>⏱️ Current Tasks</h2>${a.length?a.map(t=>taskHTML(t,false)).join(""):`<div class="card muted">No current tasks.</div>`}`);
 if(a.some(t=>t.status==="active"))setTimeout(current,1000);
}
function acceptTask(i){
 const t=db.tasks.find(x=>x.id===i);if(!t)return;
 t.status="active";t.started=Date.now();t.elapsed=0;save();current();
}
function submitTask(i){
 const t=db.tasks.find(x=>x.id===i);if(!t)return;
 t.elapsed=Date.now()-t.started;t.status="submitted";
 db.requests.push({id:id(),type:"complete_task",taskId:i,status:"pending"});
 save();current();
}

function historyPage(){
 layout(`<button class="secondary" onclick="back()">← Back</button><h2>📜 Completed / Past</h2>
 ${db.history.length?db.history.slice().reverse().map(h=>`<div class="card"><b>${esc(h.prompt)}</b><div>${h.rarity} • ${h.reward} 🟤 • ${h.xp} XP</div><div class="muted small">${new Date(h.date).toLocaleString()}</div></div>`).join(""):`<div class="card muted">No past tasks yet.</div>`}`);
}

function limitedOffer(){
 const now=Math.floor(Date.now()/3600000);
 const seed=now%SHOP.length;
 const item=SHOP[seed];
 if(item.bc<10 || item.bc>30)return {item:SHOP[(seed+3)%SHOP.length],discount:25};
 return {item,discount:25};
}
function shop(){
 const deal=limitedOffer();
 layout(`<button class="secondary" onclick="back()">← Back</button><h2>🛒 Shop</h2>
 <div class="card shopdeal"><div class="tag">🔥 LIMITED TIME OFFER • refreshes hourly</div>
 <h2>${deal.item.name} Tier ${deal.item.tier}</h2><p>${esc(deal.item.duration)}</p>
 <b>${deal.discount}% OFF • ${Math.floor(deal.item.bc*(1-deal.discount/100))} 🟤</b>
 <button onclick="addCart(${SHOP.indexOf(deal.item)},${deal.discount})">➕ Add Deal to Cart</button></div>
 <div class="row"><h3>All Items</h3><button onclick="cartPage()">🛒 Cart (${db.cart.length})</button></div>
 <div class="grid">${SHOP.map((s,i)=>`<div class="card"><b>${s.name} Tier ${s.tier}</b><p class="muted">${esc(s.duration)}</p><p>Price: ${s.bc} 🟤</p><button onclick="addCart(${i},0)">➕ Add to Cart</button></div>`).join("")}</div>`);
}
function addCart(i,discount){
 const s=SHOP[i];if(!s)return;
 db.cart.push({id:id(),shopIndex:i,discount});
 save();alert("Added to cart.");shop();
}
function cartPage(){
 layout(`<button class="secondary" onclick="shop()">← Back to Shop</button><h2>🛒 Your Cart</h2>
 ${db.cart.length?db.cart.map((c,i)=>{let s=SHOP[c.shopIndex],p=Math.floor(s.bc*(1-(c.discount||0)/100));return `<div class="card row"><div><b>${s.name} Tier ${s.tier}</b><div class="muted">${esc(s.duration)}</div></div><div><b>${p} 🟤</b> <button class="danger" onclick="removeCart(${i})">Remove</button></div></div>`}).join(""):`<div class="card muted">Your cart is empty.</div>`}
 ${db.cart.length?`<div class="card row"><span class="cart-total">Total: ${db.cart.reduce((a,c)=>a+Math.floor(SHOP[c.shopIndex].bc*(1-(c.discount||0)/100)),0)} 🟤 value</span><button onclick="checkout()">💳 Proceed with Purchase</button></div>`:""}`);
}
function removeCart(i){db.cart.splice(i,1);save();cartPage()}
function checkout(){
 const total=db.cart.reduce((a,c)=>a+Math.floor(SHOP[c.shopIndex].bc*(1-(c.discount||0)/100)),0);
 if(!spendValue(total))return alert("Not enough currency. Trade some coins first.");
 for(const c of db.cart){
   const s=SHOP[c.shopIndex];
   if(s.name==="XP Pass"){addXP([10,50,100][s.tier-1]);continue}
   if(s.name==="Lucky Block"){openLuckyBlock();continue}
   db.inventory.push({id:id(),name:s.name,tier:s.tier,duration:s.duration,active:false,remaining:null,used:false});
 }
 db.stats.spent+=total;db.cart=[];save();checkQuests();cartPage();
}
function openLuckyBlock(){
 const roll=Math.random()*100;
 let cap;
 if(roll<1)cap=60;else if(roll<11)cap=50;else if(roll<36)cap=30;else if(roll<76)cap=20;else cap=10;
 const choices=SHOP.filter(x=>x.bc<=cap && x.name!=="Lucky Block");
 if(!choices.length)return;
 const s=choices[Math.floor(Math.random()*choices.length)];
 db.inventory.push({id:id(),name:s.name,tier:s.tier,duration:s.duration,active:false,remaining:null,used:false,lucky:true});
}

function trade(){
 layout(`<button class="secondary" onclick="back()">← Back</button><h2>🔄 Trade In Center</h2>
 <div class="card"><h3>Currency Conversion</h3>
 <p class="muted">10 Bronze = 1 Gold • 5 Gold = 1 Diamond • 2 Diamond = 1 Ruby</p>
 <div class="grid">
 <button onclick="convert('b2g')">10 🟤 → 1 🟡</button>
 <button onclick="convert('g2d')">5 🟡 → 1 💎</button>
 <button onclick="convert('d2r')">2 💎 → 1 🔴</button>
 <button onclick="convert('g2b')">1 🟡 → 10 🟤</button>
 <button onclick="convert('d2g')">1 💎 → 5 🟡</button>
 <button onclick="convert('r2d')">1 🔴 → 2 💎</button>
 </div></div>
 <div class="card"><h3>Sell an Item</h3><p class="muted">Used/active items cannot be sold. Eligible items return 65% of original Bronze value.</p>
 ${db.inventory.filter(x=>!x.active&&!x.used).length?db.inventory.filter(x=>!x.active&&!x.used).map(x=>{let s=SHOP.find(y=>y.name===x.name&&y.tier===x.tier);let val=s?Math.floor(s.bc*.65):0;return `<div class="row" style="margin:8px 0"><span>${x.name} Tier ${x.tier}</span><button onclick="sellItem(${x.id})">Sell for ${val} 🟤</button></div>`}).join(""):`<div class="muted">No unused items available to sell.</div>`}
 </div>`);
}
function convert(type){
 if(type==="b2g"&&db.profile.bronze>=10){db.profile.bronze-=10;db.profile.gold++}
 else if(type==="g2d"&&db.profile.gold>=5){db.profile.gold-=5;db.profile.diamond++}
 else if(type==="d2r"&&db.profile.diamond>=2){db.profile.diamond-=2;db.profile.ruby++}
 else if(type==="g2b"&&db.profile.gold>=1){db.profile.gold--;db.profile.bronze+=10}
 else if(type==="d2g"&&db.profile.diamond>=1){db.profile.diamond--;db.profile.gold+=5}
 else if(type==="r2d"&&db.profile.ruby>=1){db.profile.ruby--;db.profile.diamond+=2}
 else return alert("Not enough currency.");
 save();trade();
}
function sellItem(itemId){
 const i=db.inventory.findIndex(x=>x.id===itemId);if(i<0)return;
 const x=db.inventory[i];if(x.active||x.used)return alert("That item cannot be sold.");
 const s=SHOP.find(y=>y.name===x.name&&y.tier===x.tier);const val=s?Math.floor(s.bc*.65):0;
 db.inventory.splice(i,1);addBronze(val);save();trade();
}

function inventory(){
 updateActiveItems();
 layout(`<button class="secondary" onclick="back()">← Back</button><div class="row"><h2>🎒 Inventory</h2><button onclick="trade()">🔄 Trade In</button></div>
 ${db.inventory.length?db.inventory.map((x,i)=>`<div class="card ${x.active?"item-active":""}">
 <div class="row"><div><b>${x.name} Tier ${x.tier}</b><div class="muted">${esc(x.duration)}</div>
 ${x.active?`<div>⏳ ${formatRemaining(x.remaining)}</div>`:""}</div>
 ${x.active?`<button onclick="requestPause(${x.id})">⏸️ Request Pause</button>`:`<button onclick="requestUse(${x.id})">▶️ Use</button>`}</div></div>`).join(""):`<div class="card muted">Inventory empty.</div>`}`);
 if(db.inventory.some(x=>x.active))setTimeout(inventory,1000);
}
function durationMs(text){
 if(!text)return 0;
 if(/5 hours/.test(text))return 5*3600000;
 if(/10 hours/.test(text))return 10*3600000;
 if(/30 minutes/.test(text))return 30*60000;
 if(/60 minutes/.test(text))return 60*60000;
 if(/5 minutes/.test(text))return 5*60000;
 if(/Entire day/.test(text))return 24*3600000;
 if(/10 XP|50 XP|100 XP/.test(text))return 0;
 if(/outside/.test(text))return 30*60000;
 return 0;
}
function formatRemaining(ms){
 ms=Math.max(0,ms||0);let s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);m%=60;s%=60;
 return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function updateActiveItems(){
 const now=Date.now();
 for(const x of db.inventory){
   if(x.active){
     if(!x.startedAt)x.startedAt=now;
     const elapsed=now-x.startedAt;
     x.remaining=Math.max(0,(x.remaining??durationMs(x.duration))-elapsed);
     x.startedAt=now;
     if(x.remaining<=0){x.active=false;x.used=true;x.remaining=0}
   }
 }
 save();
}
function requestUse(itemId){
 const x=db.inventory.find(i=>i.id===itemId);if(!x||x.used||x.active)return;
 db.requests.push({id:id(),type:"use_item",itemId,status:"pending"});save();alert("Use request sent to Admin Version.");inventory();
}
function requestPause(itemId){
 const x=db.inventory.find(i=>i.id===itemId);if(!x||!x.active)return;
 updateActiveItems();db.requests.push({id:id(),type:"pause_item",itemId,status:"pending"});save();alert("Pause request sent to Admin Version.");inventory();
}

function stats(){
 layout(`<button class="secondary" onclick="back()">← Back</button><div class="card"><h2>👤 Account Stats</h2><div class="avatar">${db.profile.avatar}</div><h3>${esc(db.profile.name)}</h3>
 <p>⭐ Level ${db.profile.level}</p><p>XP: ${db.profile.xp}/${needXP()}</p>${coins()}
 <p class="muted">Tasks completed: ${db.stats.tasksCompleted} • Bronze earned: ${db.stats.earnedBronze} • XP earned: ${db.stats.earnedXP}</p>
 <button onclick="rename()">✏️ Change Name</button> <button onclick="avatarPicker()">🎨 Avatar</button></div>`);
}
function rename(){openModal(`<h2>Change Name</h2><input id="newName" class="input" value="${esc(db.profile.name)}"><button onclick="saveName()">Save</button> <button class="secondary" onclick="closeM()">Cancel</button>`)}
function saveName(){const n=document.getElementById("newName").value.trim();if(n){db.profile.name=n;save()}closeM();stats()}
function avatarPicker(){openModal(`<h2>Choose Avatar</h2><div class="grid">${AVATARS.map(a=>`<button style="font-size:34px" onclick="setAvatar('${a}')">${a}</button>`).join("")}</div>`)}
function setAvatar(a){db.profile.avatar=a;save();closeM();stats()}

function settings(){
 layout(`<button class="secondary" onclick="back()">← Back</button><div class="card"><h2>⚙️ Settings</h2>
 <p>🎵 Music: ${db.settings.music?"On":"Off"}</p><button onclick="db.settings.music=!db.settings.music;save();settings()">Toggle Music</button>
 <p>🔊 Volume: ${db.settings.volume}%</p><input type="range" min="0" max="100" value="${db.settings.volume}" oninput="db.settings.volume=Number(this.value);save()">
 <p>🌙 Dark mode is reserved for a future cosmetics update.</p><hr>
 <button onclick="adminLogin()">🔐 Admin Version</button></div>`);
}
function adminLogin(){openModal(`<h2>🔐 Admin Version</h2><input id="au" class="input" placeholder="Username"><input id="ap" type="password" class="input" placeholder="Password"><button onclick="checkAdmin()">Enter</button> <button class="secondary" onclick="closeM()">Cancel</button>`)}
function checkAdmin(){if(document.getElementById("au").value===ADMIN_USER&&document.getElementById("ap").value===ADMIN_PASS){closeM();admin()}else alert("Incorrect login.")}

function admin(){
 updateActiveItems();
 const pending=db.requests.filter(x=>x.status==="pending");
 layout(`<div class="row"><button class="secondary" onclick="back()">← Player View</button><h2>🛠️ Admin Version</h2></div>
 <div class="card adminbox"><h3>📊 Player</h3><b>${esc(db.profile.name)}</b> • Level ${db.profile.level} • ${db.profile.xp}/${needXP()} XP<br>${coins()}
 <div class="grid" style="margin-top:10px"><button onclick="adminBalance()">💰 Alter Balance</button><button onclick="adminInventory()">🎒 Manage Inventory</button></div></div>
 <div class="card"><h3>➕ Create Task</h3><input id="tp" class="input" placeholder="Task prompt"><select id="rr" class="input">${Object.keys(RARITIES).map(x=>`<option>${x}</option>`).join("")}</select><div id="rarityInfo" class="muted"></div><button onclick="createTask()">Create Task</button></div>
 <div class="card"><h3>📨 Requests (${pending.length})</h3>${pending.length?pending.map(requestHTML).join(""):`<span class="muted">Nothing waiting.</span>`}</div>
 <div class="card"><h3>📋 Tasks</h3>${db.tasks.length?db.tasks.map(t=>{let r=RARITIES[t.rarity];return `<div class="row" style="margin:8px 0"><span><b>${esc(t.prompt)}</b><br><span class="muted">${t.rarity} • ${r.min} min • ${r.bc} 🟤 • ${r.xp} XP • ${t.status}</span></span><span>${t.status==="active"?`<button onclick="overrideTask(${t.id})">Override</button>`:""} <button class="danger" onclick="deleteTask(${t.id})">Delete</button></span></div>`}).join(""):`<span class="muted">No tasks.</span>`}</div>`);
 document.getElementById("rr").onchange=()=>showRarityInfo();
 showRarityInfo();
}
function showRarityInfo(){const r=RARITIES[document.getElementById("rr").value];document.getElementById("rarityInfo").textContent=`Target ${r.min} minutes • Full reward ${r.bc} Bronze • ${r.xp} XP • ${r.drop?"10% downgrade every 10 minutes after target":"no downgrade"}`}
function createTask(){const p=document.getElementById("tp").value.trim(),r=document.getElementById("rr").value;if(!p)return alert("Enter a task.");db.tasks.push({id:id(),prompt:p,rarity:r,status:"available"});save();admin()}
function deleteTask(i){db.tasks=db.tasks.filter(t=>t.id!==i);save();admin()}
function overrideTask(i){const t=db.tasks.find(x=>x.id===i);if(!t)return;t.elapsed=t.status==="active"?Date.now()-t.started:t.elapsed||0;t.status="submitted";db.requests.push({id:id(),type:"complete_task",taskId:i,status:"pending",override:true});save();admin()}
function adminBalance(){
 openModal(`<h2>💰 Alter Balance</h2>
 <p>Bronze</p><input id="ab" class="input" type="number" value="${db.profile.bronze}">
 <p>Gold</p><input id="ag" class="input" type="number" value="${db.profile.gold}">
 <p>Diamond</p><input id="ad" class="input" type="number" value="${db.profile.diamond}">
 <p>Ruby</p><input id="ar" class="input" type="number" value="${db.profile.ruby}">
 <button onclick="saveBalance()">Save Balance</button> <button class="secondary" onclick="closeM()">Cancel</button>`);
}
function saveBalance(){db.profile.bronze=Math.max(0,+document.getElementById("ab").value||0);db.profile.gold=Math.max(0,+document.getElementById("ag").value||0);db.profile.diamond=Math.max(0,+document.getElementById("ad").value||0);db.profile.ruby=Math.max(0,+document.getElementById("ar").value||0);save();closeM();admin()}
function adminInventory(){
 openModal(`<h2>🎒 Manage Inventory</h2>${db.inventory.length?db.inventory.map(x=>`<div class="row card"><span>${x.name} Tier ${x.tier}${x.active?" • ACTIVE":""}</span><button class="danger" onclick="adminDeleteItem(${x.id})">Delete</button></div>`).join(""):`<p class="muted">Inventory empty.</p>`}<button class="secondary" onclick="closeM()">Close</button>`);
}
function adminDeleteItem(i){db.inventory=db.inventory.filter(x=>x.id!==i);save();adminInventory()}

function requestHTML(q){
 if(q.type==="complete_task"){
  const t=db.tasks.find(x=>x.id===q.taskId);return `<div class="card"><b>✅ Task Completion</b><p>${t?esc(t.prompt):"Missing task"}</p><button onclick="approveTask(${q.id})">Approve</button> <button class="danger" onclick="rejectRequest(${q.id})">Reject</button></div>`;
 }
 const x=db.inventory.find(i=>i.id===q.itemId);
 if(q.type==="pause_item")return `<div class="card"><b>⏸️ Pause Item</b><p>${x?x.name+" Tier "+x.tier:"Missing item"}</p><button onclick="approvePause(${q.id})">Approve</button> <button class="danger" onclick="rejectRequest(${q.id})">Reject</button></div>`;
 return `<div class="card"><b>🎒 Use Item</b><p>${x?x.name+" Tier "+x.tier:"Missing item"}</p><button onclick="approveItem(${q.id})">Approve</button> <button class="danger" onclick="rejectRequest(${q.id})">Reject</button></div>`;
}
function approveTask(qid){
 const q=db.requests.find(x=>x.id===qid),t=db.tasks.find(x=>x.id===q.taskId);if(!q||!t)return;
 const r=RARITIES[t.rarity],m=(t.elapsed||0)/60000,d=r.drop?Math.floor(Math.max(0,m-r.min)/10):0,reward=Math.max(0,Math.floor(r.bc*(1-d*.1)));
 t.status="completed";q.status="approved";addBronze(reward);addXP(r.xp);db.stats.tasksCompleted++;
 db.history.push({prompt:t.prompt,rarity:t.rarity,reward,xp:r.xp,date:Date.now()});save();admin();
}
function approveItem(qid){
 const q=db.requests.find(x=>x.id===qid),x=db.inventory.find(i=>i.id===q.itemId);if(!q||!x)return;
 x.active=true;x.used=false;x.remaining=durationMs(x.duration);x.startedAt=Date.now();q.status="approved";save();admin();
}
function approvePause(qid){
 const q=db.requests.find(x=>x.id===qid),x=db.inventory.find(i=>i.id===q.itemId);if(!q||!x)return;
 updateActiveItems();x.active=false;x.paused=true;x.startedAt=null;q.status="approved";save();admin();
}
function rejectRequest(qid){
 const q=db.requests.find(x=>x.id===qid);if(!q)return;
 q.status="rejected";
 if(q.type==="complete_task"){const t=db.tasks.find(x=>x.id===q.taskId);if(t){t.status="active";t.started=Date.now()-(t.elapsed||0)}}
 save();admin();
}

function checkQuests(){
 const today=new Date().toISOString().slice(0,10);
 if(db.quests.date!==today){
   db.quests.date=today;
   db.quests.items=QUEST_DEFS.map((q,i)=>({id:i,name:q[0],xp:q[1],bc:q[2],claimed:false}));
   save();
 }
}
function questsPage(){
 checkQuests();
 layout(`<button class="secondary" onclick="back()">← Back</button><h2>⭐ Daily Quests</h2><p class="muted">Refreshes every day. Rewards are shown on each quest.</p>
 ${db.quests.items.map(q=>`<div class="card quest"><div class="row"><div><b>${esc(q.name)}</b><div>${q.xp} XP • ${q.bc} 🟤</div></div><span class="pill">${questDone(q)? "✅ Complete":"⏳ In progress"}</span></div>${questDone(q)&&!q.claimed?`<button onclick="claimQuest(${q.id})">Claim Reward</button>`:q.claimed?`<span class="muted">Reward claimed.</span>`:""}</div>`).join("")}`);
}
function questDone(q){
 const n=q.name;
 if(n.startsWith("Spend at least 30"))return db.stats.spent>=30;
 if(n.startsWith("Spend at least 20"))return db.stats.spent>=20;
 if(n.startsWith("Spend at least 10"))return db.stats.spent>=10;
 if(n.startsWith("Earn at least 30"))return db.stats.earnedBronze>=30;
 if(n.startsWith("Earn at least 20"))return db.stats.earnedBronze>=20;
 if(n.startsWith("Earn at least 10"))return db.stats.earnedBronze>=10;
 if(n.startsWith("Complete at least three"))return db.stats.tasksCompleted>=3;
 if(n.startsWith("Complete at least two"))return db.stats.tasksCompleted>=2;
 if(n.startsWith("Complete at least one"))return db.stats.tasksCompleted>=1;
 if(n.startsWith("Earn at least 20 XP"))return db.stats.earnedXP>=20;
 if(n.startsWith("Earn at least 10 XP"))return db.stats.earnedXP>=10;
 if(n.startsWith("Level up"))return db.profile.level>1;
 if(n.startsWith("Play 1 hour"))return db.stats.forgeSeconds>=3600;
 return false;
}
function claimQuest(i){const q=db.quests.items.find(x=>x.id===i);if(!q||q.claimed||!questDone(q))return;q.claimed=true;addBronze(q.bc);addXP(q.xp);save();questsPage()}

function openModal(content){document.getElementById("modalBox").innerHTML=content;document.getElementById("modal").classList.remove("hidden")}
function closeM(){document.getElementById("modal").classList.add("hidden")}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
checkQuests();updateActiveItems();save();home();
</script>
</body>
</html>
